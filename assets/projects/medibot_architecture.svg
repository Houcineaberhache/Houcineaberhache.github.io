<svg viewBox="0 0 1200 640" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4d6bfe"/>
      <stop offset="100%" stop-color="#7b9bff"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#5a6478"/>
    </marker>
    <marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4d6bfe"/>
    </marker>
  </defs>

  <rect width="1200" height="640" fill="#0f1117"/>

  <!-- Title -->
  <text x="60" y="56" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#eef1f8">MediBot — RAG Architecture</text>
  <text x="60" y="80" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#7d879c">Retrieval-Augmented Generation pipeline for medical document Q&amp;A</text>

  <!-- ===================== INGESTION PATH (top) ===================== -->
  <text x="60" y="130" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" fill="#4d6bfe">DOCUMENT INGESTION</text>

  <!-- Box: PDF Upload -->
  <g>
    <rect x="60" y="150" width="150" height="80" rx="14" fill="#171a24" stroke="#2a2f3d" stroke-width="1.5"/>
    <text x="135" y="182" text-anchor="middle" font-family="Helvetica" font-size="24">📄</text>
    <text x="135" y="208" text-anchor="middle" font-family="Helvetica" font-size="13" font-weight="600" fill="#eef1f8">PDF Upload</text>
    <text x="135" y="223" text-anchor="middle" font-family="Helvetica" font-size="10.5" fill="#7d879c">FastAPI endpoint</text>
  </g>

  <line x1="210" y1="190" x2="248" y2="190" stroke="#3a4055" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Box: Chunking -->
  <g>
    <rect x="250" y="150" width="150" height="80" rx="14" fill="#171a24" stroke="#2a2f3d" stroke-width="1.5"/>
    <text x="325" y="182" text-anchor="middle" font-family="Helvetica" font-size="24">✂️</text>
    <text x="325" y="208" text-anchor="middle" font-family="Helvetica" font-size="13" font-weight="600" fill="#eef1f8">Chunking</text>
    <text x="325" y="223" text-anchor="middle" font-family="Helvetica" font-size="10.5" fill="#7d879c">LangChain splitter</text>
  </g>

  <line x1="400" y1="190" x2="438" y2="190" stroke="#3a4055" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Box: Embeddings -->
  <g>
    <rect x="440" y="150" width="160" height="80" rx="14" fill="#171a24" stroke="#2a2f3d" stroke-width="1.5"/>
    <text x="520" y="182" text-anchor="middle" font-family="Helvetica" font-size="24">🧬</text>
    <text x="520" y="208" text-anchor="middle" font-family="Helvetica" font-size="13" font-weight="600" fill="#eef1f8">Embeddings</text>
    <text x="520" y="223" text-anchor="middle" font-family="Helvetica" font-size="10.5" fill="#7d879c">Google Generative AI</text>
  </g>

  <line x1="600" y1="190" x2="638" y2="190" stroke="#3a4055" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Box: Pinecone (highlighted) -->
  <g>
    <rect x="640" y="140" width="180" height="100" rx="16" fill="#151b2e" stroke="url(#accentGrad)" stroke-width="2"/>
    <text x="730" y="178" text-anchor="middle" font-family="Helvetica" font-size="26">🗂️</text>
    <text x="730" y="205" text-anchor="middle" font-family="Helvetica" font-size="14" font-weight="700" fill="#eef1f8">Pinecone</text>
    <text x="730" y="222" text-anchor="middle" font-family="Helvetica" font-size="10.5" fill="#9fb0ff">Vector database</text>
  </g>

  <!-- ===================== QUERY PATH (bottom) ===================== -->
  <text x="60" y="330" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" fill="#4ade80">QUERY &amp; GENERATION</text>

  <!-- Box: User Question -->
  <g>
    <rect x="60" y="350" width="150" height="80" rx="14" fill="#171a24" stroke="#2a2f3d" stroke-width="1.5"/>
    <text x="135" y="382" text-anchor="middle" font-family="Helvetica" font-size="24">🧑‍⚕️</text>
    <text x="135" y="408" text-anchor="middle" font-family="Helvetica" font-size="13" font-weight="600" fill="#eef1f8">User Question</text>
    <text x="135" y="423" text-anchor="middle" font-family="Helvetica" font-size="10.5" fill="#7d879c">Chat interface</text>
  </g>

  <line x1="210" y1="390" x2="248" y2="390" stroke="#3a4055" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Box: Query Embedding -->
  <g>
    <rect x="250" y="350" width="150" height="80" rx="14" fill="#171a24" stroke="#2a2f3d" stroke-width="1.5"/>
    <text x="325" y="382" text-anchor="middle" font-family="Helvetica" font-size="24">🔎</text>
    <text x="325" y="408" text-anchor="middle" font-family="Helvetica" font-size="13" font-weight="600" fill="#eef1f8">Query Embedding</text>
    <text x="325" y="423" text-anchor="middle" font-family="Helvetica" font-size="10.5" fill="#7d879c">Same embedding model</text>
  </g>

  <!-- Arrow up into Pinecone (retrieval) -->
  <path d="M 325 350 L 325 280 L 730 280 L 730 240" fill="none" stroke="#4d6bfe" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrowAccent)"/>
  <text x="500" y="272" text-anchor="middle" font-family="Helvetica" font-size="10.5" fill="#4d6bfe" font-style="italic">similarity search</text>

  <!-- Arrow from Pinecone down (retrieved chunks) -->
  <path d="M 820 190 L 900 190 L 900 390 L 838 390" fill="none" stroke="#4ade80" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="905" y="290" font-family="Helvetica" font-size="10.5" fill="#4ade80" font-style="italic" transform="rotate(90 905 290)" text-anchor="middle">retrieved chunks</text>

  <!-- Box: RAG Chain -->
  <g>
    <rect x="640" y="350" width="200" height="80" rx="14" fill="#171a24" stroke="#2a2f3d" stroke-width="1.5"/>
    <text x="740" y="382" text-anchor="middle" font-family="Helvetica" font-size="24">🔗</text>
    <text x="740" y="408" text-anchor="middle" font-family="Helvetica" font-size="13" font-weight="600" fill="#eef1f8">RAG Chain (LCEL)</text>
    <text x="740" y="423" text-anchor="middle" font-family="Helvetica" font-size="10.5" fill="#7d879c">LangChain pipeline</text>
  </g>

  <line x1="840" y1="390" x2="878" y2="390" stroke="#3a4055" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Box: Groq LLM -->
  <g>
    <rect x="880" y="350" width="150" height="80" rx="14" fill="#171a24" stroke="#2a2f3d" stroke-width="1.5"/>
    <text x="955" y="382" text-anchor="middle" font-family="Helvetica" font-size="24">⚡</text>
    <text x="955" y="408" text-anchor="middle" font-family="Helvetica" font-size="13" font-weight="600" fill="#eef1f8">Groq LLM</text>
    <text x="955" y="423" text-anchor="middle" font-family="Helvetica" font-size="10.5" fill="#7d879c">gpt-oss-120b</text>
  </g>

  <line x1="955" y1="430" x2="955" y2="470" stroke="#3a4055" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Final Answer box -->
  <g>
    <rect x="855" y="472" width="200" height="90" rx="16" fill="#151f16" stroke="url(#greenGrad)" stroke-width="2"/>
    <text x="955" y="505" text-anchor="middle" font-family="Helvetica" font-size="24">✅</text>
    <text x="955" y="530" text-anchor="middle" font-family="Helvetica" font-size="14" font-weight="700" fill="#eef1f8">Grounded Answer</text>
    <text x="955" y="547" text-anchor="middle" font-family="Helvetica" font-size="10.5" fill="#8fe6a3">+ source citations</text>
  </g>

  <!-- Legend / footer -->
  <text x="60" y="600" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5a6478">Stack: FastAPI · LangChain (LCEL) · Pinecone · Google Generative AI Embeddings · Groq</text>
  <text x="60" y="620" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3f4657">medibot.qodeck.app</text>
</svg>
